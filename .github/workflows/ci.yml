name: CI

on:
  push:
  pull_request:
  # Once a week, for the profile build below; by hand from the Actions tab.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      # MSVC's environment for its STL, SDK and linker.
      - uses: ilammy/msvc-dev-cmd@v1
      # Visual Studio's own clang-cl ahead of the runner's LLVM: its STL asks
      # for the clang it ships with.
      - name: Use Visual Studio's clang
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          "$vs\VC\Tools\Llvm\x64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$vs\VC\Tools\Llvm\x64\bin\clang-cl.exe" --version
      - name: Configure
        run: cmake --preset windows-debug
      - name: Build
        run: cmake --build --preset windows-debug
      - name: Test
        run: ctest --preset windows-debug
      # A picture the renderer's tests found off its reference, to look at.
      - name: Keep the pictures that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pictures-windows
          path: out/build/windows-debug/projects/tests/*.actual.png
          if-no-files-found: ignore

  # The same tests optimized, with the Tracy client compiled in: the one
  # optimized Windows build, and the one that builds Tracy. Weekly - a
  # second Windows build on every push costs more than what it finds.
  windows-profile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      # Visual Studio's own clang-cl ahead of the runner's LLVM: its STL asks
      # for the clang it ships with.
      - name: Use Visual Studio's clang
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          "$vs\VC\Tools\Llvm\x64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$vs\VC\Tools\Llvm\x64\bin\clang-cl.exe" --version
      - name: Configure
        run: cmake --preset windows-profile
      - name: Build
        run: cmake --build --preset windows-profile
      - name: Test
        run: out/build/windows-profile/bin/bubble_tests.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # libc++, LLVM's own standard library: the one Emscripten, the NDK and
      # Xcode use too. Ubuntu's clang would otherwise take GCC 13's
      # libstdc++, whose std::expected clang 20 cannot see.
      - name: Install clang 20, libc++ and Ninja
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y ninja-build libc++-20-dev libc++abi-20-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100
      # SDL's windows on Linux: X11 and Wayland, gamepads through udev; and
      # lavapipe, Mesa's software Vulkan, for the GPU tests on a runner with
      # no GPU.
      - name: Install SDL's and the GPU's dependencies
        run: >-
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev libdrm-dev
          libgbm-dev libdbus-1-dev libudev-dev mesa-vulkan-drivers
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build --preset linux
      - name: Test
        run: ctest --preset linux
      - name: Keep the pictures that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pictures-linux
          path: out/build/linux/projects/tests/*.actual.png
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset web
      - name: Build
        run: cmake --build --preset web
      # The Emscripten toolchain runs the tests under node.
      - name: Test
        run: ctest --preset web
