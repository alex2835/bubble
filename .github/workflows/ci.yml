name: CI

on:
  push:
  pull_request:
  # Once a week, for the profile build below; by hand from the Actions tab.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      # MSVC's environment for its STL, SDK and linker; the compiler is the
      # runner's LLVM clang-cl.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows-debug
      - name: Build
        run: cmake --build --preset windows-debug
      - name: Test
        run: ctest --preset windows-debug

  # The same tests optimized, with the Tracy client compiled in: the one
  # optimized Windows build, and the one that builds Tracy. Weekly - a
  # second Windows build on every push costs more than what it finds.
  windows-profile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows-profile
      - name: Build
        run: cmake --build --preset windows-profile
      - name: Test
        run: out/build/windows-profile/bin/bubble_tests.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # libc++, LLVM's own standard library: the one Emscripten, the NDK and
      # Xcode use too. Ubuntu's clang would otherwise take GCC 13's
      # libstdc++, whose std::expected clang 20 cannot see.
      - name: Install clang 20, libc++ and Ninja
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y ninja-build libc++-20-dev libc++abi-20-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build --preset linux
      - name: Test
        run: ctest --preset linux

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset web
      - name: Build
        run: cmake --build --preset web
      # The Emscripten toolchain runs the tests under node.
      - name: Test
        run: ctest --preset web
